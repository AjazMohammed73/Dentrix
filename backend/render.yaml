# Render Blueprint for the Dentrix API.
# Connect the repo in Render, then set DATABASE_URL and CORS_ORIGINS (marked sync:false).
services:
  - type: web
    name: dentrix-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false      # paste the Neon pooled connection string
      - key: CORS_ORIGINS
        sync: false      # e.g. https://your-app.vercel.app

  # Weekly audit-log retention (archive rows > AUDIT_RETENTION_DAYS, then prune).
  # Set AUDIT_ARCHIVE_S3_BUCKET + credentials to push archives off-box; otherwise
  # attach a persistent disk and point AUDIT_ARCHIVE_DIR at it.
  - type: cron
    name: dentrix-audit-retention
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 3 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.retention
    envVars:
      - key: DATABASE_URL
        sync: false      # same Neon string as the web service
      - key: AUDIT_RETENTION_DAYS
        value: "90"
      - key: JWT_SECRET   # not used by this job, but app.config requires it to load
        fromService:
          type: web
          name: dentrix-api
          envVarKey: JWT_SECRET
