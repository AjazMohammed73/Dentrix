# Render Blueprint for the Dentrix API.
# Connect the repo in Render, then set DATABASE_URL and CORS_ORIGINS (marked sync:false).
services:
  - type: web
    name: dentrix-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false      # paste the Neon pooled connection string
      - key: CORS_ORIGINS
        sync: false      # e.g. https://your-app.vercel.app

  # ponytail: cron job (weekly audit-log retention) needs a paid plan on Render,
  # dropped for the free-tier deploy. Re-add once ready to pay — see git history
  # for the original block (archives + prunes audit rows > AUDIT_RETENTION_DAYS).
