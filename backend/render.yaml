# Render Blueprint for the Dentrix API.
# Connect the repo in Render, then set DATABASE_URL and CORS_ORIGINS (marked sync:false).
services:
  - type: web
    name: dentrix-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false      # paste the Neon pooled connection string
      - key: CORS_ORIGINS
        sync: false      # e.g. https://your-app.vercel.app
